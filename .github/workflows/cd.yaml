name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar credenciales AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Escribir la versión en el artefacto
        run: |
          echo "${{ github.ref_name }}" > .app-version

      - name: Verificar estructura
        run: |
          echo "--- Raíz ---"
          ls -la
          echo "--- Scripts ---"
          ls -la scripts || true

      - name: Preparar script de arranque con variables del workflow
        env:
          DEPLOY_AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          DEPLOY_APP_VERSION: latest
        run: |
          cat > scripts/start_app.sh <<EOF
          #!/bin/bash
          set -euo pipefail

          APP_VERSION="\${APP_VERSION:-${DEPLOY_APP_VERSION}}"
          export APP_VERSION

          cd /opt/mi-app

          AWS_REGION="\${AWS_REGION:-${DEPLOY_AWS_REGION}}"
          export AWS_REGION

          ECR_REGISTRY="\${ECR_REGISTRY:-${DEPLOY_ECR_REGISTRY}}"
          if [[ -z "\${ECR_REGISTRY}" ]]; then
            ACCOUNT_ID="\$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="\${ACCOUNT_ID}.dkr.ecr.\${AWS_REGION}.amazonaws.com"
          fi
          export ECR_REGISTRY

          aws ecr get-login-password --region "\$AWS_REGION" | \
            docker login --username AWS --password-stdin \
            "\$ECR_REGISTRY"

          COMPOSE_FILE="\${COMPOSE_FILE:-docker-compose.yml}"
          export COMPOSE_FILE

          docker compose -f "\$COMPOSE_FILE" pull
          docker compose -f "\$COMPOSE_FILE" down --remove-orphans
          docker compose -f "\$COMPOSE_FILE" up -d
          docker image prune -f
          EOF
          chmod +x scripts/start_app.sh

      - name: Empaquetar y subir a S3
        run: |
          aws deploy push \
            --application-name "${{ vars.CODEDEPLOY_APP }}" \
            --s3-location "s3://${{ vars.S3_BUCKET }}/releases/${{ github.ref_name }}.zip" \
            --source .

      - name: Crear deployment en CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name "${{ vars.CODEDEPLOY_APP }}" \
            --deployment-group-name "${{ vars.CODEDEPLOY_GROUP }}" \
            --s3-location "bucket=${{ vars.S3_BUCKET }},key=releases/${{ github.ref_name }}.zip,bundleType=zip" \
            --description "Deploy ${{ github.ref_name }} (commit ${{ github.sha }})"